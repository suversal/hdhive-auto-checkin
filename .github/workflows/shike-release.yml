name: Publish Shike Docker

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shike-image-publish
  cancel-in-progress: false

jobs:
  checks:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'shike-v')
    uses: ./.github/workflows/shike-ci.yml
  publish:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.release.outputs.version }}
      repository: ${{ steps.release.outputs.repository }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Validate release and choose tags
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          python3 - <<'PY'
          import os, re, runpy
          repository = os.environ['GITHUB_REPOSITORY'].lower()
          version = runpy.run_path('shike/__init__.py')['__version__']
          tags = [f'ghcr.io/{repository}:sha-{os.environ["GITHUB_SHA"]}']
          if os.environ['GITHUB_EVENT_NAME'] == 'release':
              tag = os.environ['RELEASE_TAG']
              if not re.fullmatch(r'shike-v[0-9]+\.[0-9]+\.[0-9]+(?:-[A-Za-z0-9.-]+)?', tag) or tag != 'shike-v' + version:
                  raise SystemExit('Release 标签必须为 shike-v版本号，并与 shike/__init__.py 一致')
              tags.append(f'ghcr.io/{repository}:{version}')
              if os.environ['IS_PRERELEASE'] != 'true' and '-' not in version:
                  tags.append(f'ghcr.io/{repository}:latest')
          else:
              tags.append(f'ghcr.io/{repository}:edge')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\nrepository={repository}\ntags<<TAGS\n' + '\n'.join(tags) + '\nTAGS\n')
          PY
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        id: image
        with:
          context: .
          file: Dockerfile.shike
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.release.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=拾刻 Shike
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=shike-release
          cache-to: type=gha,mode=max,scope=shike-release
      - name: Publish summary
        env:
          IMAGE_REPOSITORY: ${{ steps.release.outputs.repository }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          printf 'Published image: `ghcr.io/%s@%s`\n\n首次发布请在 Package settings 中将包设为 Public，以便用户免登录拉取。\n' "$IMAGE_REPOSITORY" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
  bundle:
    needs: publish
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Package Docker installer
        env:
          SHIKE_VERSION: ${{ needs.publish.outputs.version }}
          SHIKE_REPOSITORY: ${{ needs.publish.outputs.repository }}
        run: python3 deploy/package.py --version "$SHIKE_VERSION" --repository "$SHIKE_REPOSITORY"
      - name: Attach installation bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/shike-docker-*.zip dist/SHA256SUMS --clobber
