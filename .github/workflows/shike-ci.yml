name: Shike Service Checks

on:
  workflow_call:
  pull_request:
    paths: ["shike/**", "server/**", "web/**", "deploy/**", "shike.sh", "Dockerfile.shike", "compose*.yaml", ".env.shike.example", ".dockerignore", ".github/workflows/shike-*.yml"]
  push:
    branches: ["**"]
    paths: ["shike/**", "server/**", "web/**", "deploy/**", "shike.sh", "Dockerfile.shike", "compose*.yaml", ".env.shike.example", ".dockerignore", ".github/workflows/shike-*.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: server/requirements-dev.txt
      - run: python -m pip install -r server/requirements-dev.txt
      - run: python -m pytest server/tests -q
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm run build --prefix web
      - run: git diff --exit-code -- web/app.js web/calendar.css web/THIRD_PARTY_NOTICES.txt
      - run: sh -n shike.sh
      - run: python deploy/package.py --version 0.1.0 --output /tmp/shike-bundle
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.shike
          load: true
          tags: shike:ci
          cache-from: type=gha,scope=shike-smoke
          cache-to: type=gha,mode=max,scope=shike-smoke
      - run: python3 deploy/smoke.py --image shike:ci
  legacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests
        env:
          TELEGRAM_LOCAL_CONFIG_PATH: /tmp/shike-no-local-config.json
