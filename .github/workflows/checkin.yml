name: HDHive Telegram Check-in

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/checkin.yml"
      - "requirements.txt"
      - "local.config.example.json"
  schedule:
    # 北京时间每天 06:23，UTC 为前一天 22:23
    - cron: "23 22 * * *"

permissions:
  contents: read

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Shanghai
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
      HDHIVE_BOT_USERNAME: ${{ secrets.HDHIVE_BOT_USERNAME }}
      HDHIVE_SIGN_COMMAND: ${{ vars.HDHIVE_SIGN_COMMAND || '赌狗签到' }}
      TELEGRAM_NOTIFY_CHAT_ID: ${{ vars.TELEGRAM_NOTIFY_CHAT_ID }}
      TELEGRAM_RESPONSE_TIMEOUT_SECONDS: ${{ vars.TELEGRAM_RESPONSE_TIMEOUT_SECONDS || '60' }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Run HDHive Telegram check-in
        timeout-minutes: 8
        run: python scripts/telegram_checkin.py

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hdhive-artifacts
          path: artifacts/
          if-no-files-found: ignore
